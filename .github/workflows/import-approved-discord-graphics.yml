name: Import approved Efrotz Discord graphics
on:
  push:
    paths:
      - '.github/workflows/import-approved-discord-graphics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-approved-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out asset library
        uses: actions/checkout@v4
      - name: Download and verify approved images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p approved/discord
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 120 \
            'https://i.postimg.cc/G9n4srkb/welcome-to-efrotz-hq.png' \
            --output approved/discord/efrotz-welcome-banner.png
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 120 \
            'https://i.postimg.cc/m2nZPTyH/Efrotz-Welcome-Embed-Mascot-512.png' \
            --output approved/discord/efrotz-welcome-mascot-512.png
          python3 -m pip install --quiet Pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from hashlib import sha256
          expected = {
              'approved/discord/efrotz-welcome-banner.png': ((2172, 724), '7f75f63535efd95be7e49a0e7f539c60a218962d01e248e17d9cbcd765431b9d'),
              'approved/discord/efrotz-welcome-mascot-512.png': ((512, 512), '01e17b47a66cf52edaf465353a472fcaae5f2ec5514113b8feaec981ef9ad12e'),
          }
          for name, (dims, pixels_sha) in expected.items():
              raw = Path(name).read_bytes()
              image = Image.open(name)
              image.load()
              actual_sha = sha256(image.convert('RGBA').tobytes()).hexdigest()
              print(name, image.size, len(raw), 'bytes; file SHA256', sha256(raw).hexdigest(), 'pixel SHA256', actual_sha)
              assert image.format == 'PNG', f'Not a PNG: {name}'
              assert image.size == dims, f'Unexpected dimensions: {name}'
              assert actual_sha == pixels_sha, f'Content differs from approved image: {name}'
          PY
      - name: Commit approved graphics
        shell: bash
        run: |
          set -euo pipefail
          git add approved/discord/efrotz-welcome-banner.png approved/discord/efrotz-welcome-mascot-512.png
          if git diff --staged --quiet; then
            echo 'Assets already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add approved Discord welcome banner and 512px mascot'
          git push
